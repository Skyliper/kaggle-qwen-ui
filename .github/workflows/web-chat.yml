name: Publish NextChat web client
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ChatGPTNextWeb/NextChat
          ref: 1d3dc331512929a4b1d3e82354e72acce33b5c7a
          path: _nextchat
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global yarn@1.22.22
      - uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: nextchat-${{ runner.os }}-${{ hashFiles('_nextchat/yarn.lock') }}
      - run: python scripts/prepare_nextchat.py _nextchat
      - run: yarn install --frozen-lockfile --non-interactive --network-timeout 120000
        working-directory: _nextchat
        env:
          HUSKY: '0'
      - run: yarn mask && yarn next build
        working-directory: _nextchat
        env:
          BUILD_MODE: export
          NEXT_TELEMETRY_DISABLED: '1'
      - run: |
          python scripts/finish_nextchat.py _nextchat
          mkdir -p _site/chat
          cp index.html login.js app.css server.html _site/
          cp -r _nextchat/out/. _site/chat/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
